<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>局域网文件传输</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: #f0f6fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px;
            padding: 30px 28px;
            box-shadow: 0 20px 40px rgba(0,20,30,0.08);
            border: 1px solid rgba(255,255,255,0.3);
        }
        h1 { 
            margin-top: 0; 
            font-weight: 600; 
            color: #1a3a4a; 
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .flex { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 60px;
            background: #e4ecf3;
            color: #1a3a4a;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: #1a5c7a; color: white; }
        .btn-primary:hover { background: #134b63; }
        .btn-success { background: #1c8b6c; color: white; }
        .btn-success:hover { background: #147a5e; }
        .btn-danger { background: #b94a4a; color: white; }
        .btn-danger:hover { background: #a13d3d; }
        .btn:disabled { opacity: 0.4; pointer-events: none; }
        .input-group {
            display: flex;
            gap: 8px;
            flex: 1;
            min-width: 200px;
        }
        .input-group input {
            flex: 1;
            padding: 10px 18px;
            border-radius: 60px;
            border: 1px solid #d0dce6;
            font-size: 1rem;
            background: #f8fafc;
            outline: none;
            transition: 0.15s;
        }
        .input-group input:focus { border-color: #1a5c7a; box-shadow: 0 0 0 3px rgba(26,92,122,0.15); }
        .status-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 16px 0 12px;
            padding: 10px 0;
            border-top: 1px solid #e6edf4;
            border-bottom: 1px solid #e6edf4;
        }
        .badge {
            background: #eef3f7;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge.connected { background: #d4eddf; color: #0a4d3a; }
        .badge.room { background: #dce6f0; }
        .file-drop {
            border: 2px dashed #b8d0e0;
            border-radius: 28px;
            padding: 40px 12px;
            text-align: center;
            margin: 18px 0;
            cursor: pointer;
            transition: 0.15s;
            background: #fafdff;
        }
        .file-drop.dragover {
            background: #eaf2fa;
            border-color: #1a5c7a;
        }
        .file-drop input[type="file"] { display: none; }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 8px 16px 8px 20px;
            border-radius: 60px;
            margin-bottom: 8px;
            border: 1px solid #eaf0f6;
        }
        .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
        .file-size { color: #4f6f84; margin: 0 12px; font-size: 0.85rem; }
        .file-status {
            font-size: 0.8rem;
            background: #dce8f0;
            padding: 2px 16px;
            border-radius: 40px;
            color: #1a3a4a;
        }
        .file-status.done { background: #b8dfce; color: #0a4d3a; }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
        hr { margin: 20px 0; border: none; border-top: 1px solid #e6edf4; }
        .footer { text-align: center; color: #6f8fa3; font-size: 0.8rem; margin-top: 20px; }
        .hint {
            background: #e8f0fe;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #1a4a6a;
            margin: 10px 0;
            border-left: 4px solid #1a5c7a;
        }
        .hint code {
            background: #d4e2f0;
            padding: 2px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>📡 局域网快传</h1>

    <!-- 提示信息：终端已显示 IP -->
    <div class="hint">
        💡 请查看 <strong>终端</strong> 中的 "局域网访问" 地址，其他设备使用该地址访问
    </div>

    <div class="flex">
        <button class="btn btn-primary" @click="createRoom">✨ 创建房间</button>
        <div class="input-group">
            <input type="text" v-model="roomInput" placeholder="输入房间号加入" @keyup.enter="joinRoom" />
            <button class="btn btn-success" @click="joinRoom" :disabled="!roomInput">加入</button>
        </div>
    </div>

    <div class="status-bar">
        <span class="badge" :class="{ connected: connected }">
            {{ connected ? '🟢 已连接' : '⚪ 未连接' }}
        </span>
        <span class="badge room" v-if="roomId">🏠 房间: {{ roomId }} (成员: {{ memberCount }})</span>
        <span class="badge" v-else>暂无房间</span>
    </div>

    <div class="file-drop" @dragover.prevent="dragover=true" @dragleave="dragover=false" @drop.prevent="handleDrop" @click="triggerFileInput" :class="{ dragover }">
        <div style="font-size: 2.4rem; margin-bottom: 6px;">📤</div>
        <div style="font-weight: 500; color: #1a3a4a;">点击选择文件 或 拖拽到此处</div>
        <div style="font-size:0.8rem; color:#4f6f84; margin-top:4px;">支持多文件 · 最大 50MB 建议</div>
        <input type="file" multiple ref="fileInput" @change="handleFiles" />
    </div>

    <div v-if="files.length">
        <div class="file-item" v-for="(f, i) in files" :key="i">
            <span class="file-name">{{ f.name }}</span>
            <span class="file-size">{{ (f.size/1024).toFixed(1) }} KB</span>
            <span class="file-status" :class="{ done: f.done }">{{ f.done ? '✔ 已发送' : '⏳ 待发' }}</span>
        </div>
        <div class="actions">
            <button class="btn" @click="clearFiles">🗑️ 清空</button>
            <button class="btn btn-primary" @click="sendAllFiles" :disabled="!connected || !files.length || sending">
                {{ sending ? '发送中...' : '📨 发送全部' }}
            </button>
        </div>
    </div>

    <hr />
    <div class="footer">💡 同一局域网 · 创建房间获得房间号 · 其他设备输入房间号加入</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
<script>
    new Vue({
        el: '#app',
        data: {
            roomInput: '',
            roomId: '',
            connected: false,
            memberCount: 0,
            files: [],
            dragover: false,
            ws: null,
            sending: false,
        },
        methods: {
            // WebSocket 连接
            connectWebSocket() {
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${location.host}`;
                this.ws = new WebSocket(wsUrl);
                this.ws.onopen = () => {
                    console.log('WebSocket 已连接');
                };
                this.ws.onmessage = (e) => {
                    let data;
                    try { data = JSON.parse(e.data); } catch { return; }
                    this.handleMessage(data);
                };
                this.ws.onclose = () => {
                    console.log('WebSocket 断开');
                    this.connected = false;
                };
                this.ws.onerror = (err) => {
                    console.error('WebSocket 错误', err);
                    alert('连接服务器失败，请检查网络或服务是否运行');
                };
            },
            handleMessage(data) {
                const { type } = data;
                switch (type) {
                    case 'room-created': {
                        this.roomId = data.roomId;
                        this.memberCount = data.members;
                        this.connected = true;
                        break;
                    }
                    case 'joined': {
                        this.roomId = data.roomId;
                        this.memberCount = data.members;
                        this.connected = true;
                        break;
                    }
                    case 'members-update': {
                        this.memberCount = data.members;
                        break;
                    }
                    case 'file-receive': {
                        const { fileName, fileSize, fileDataBase64 } = data;
                        this.downloadFile(fileName, fileDataBase64);
                        break;
                    }
                    case 'error': {
                        alert('❌ ' + data.message);
                        break;
                    }
                    default:
                        break;
                }
            },
            // 创建房间
            createRoom() {
                this.ensureConnected(() => {
                    this.ws.send(JSON.stringify({ type: 'create-room' }));
                });
            },
            // 加入房间
            joinRoom() {
                const room = this.roomInput.trim();
                if (!room) return;
                this.ensureConnected(() => {
                    this.ws.send(JSON.stringify({ type: 'join-room', roomId: room }));
                });
            },
            ensureConnected(callback) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    callback();
                } else {
                    this.connectWebSocket();
                    this.ws.onopen = () => {
                        callback();
                    };
                }
            },
            // 文件选择
            triggerFileInput() {
                this.$refs.fileInput.click();
            },
            handleFiles(e) {
                const files = e.target.files;
                for (const f of files) {
                    if (f.size > 50 * 1024 * 1024) {
                        alert(`文件 "${f.name}" 超过 50MB，请压缩后重试`);
                        continue;
                    }
                    this.files.push({
                        name: f.name,
                        size: f.size,
                        file: f,
                        done: false,
                    });
                }
                e.target.value = '';
            },
            handleDrop(e) {
                this.dragover = false;
                const files = e.dataTransfer.files;
                for (const f of files) {
                    if (f.size > 50 * 1024 * 1024) {
                        alert(`文件 "${f.name}" 超过 50MB，请压缩后重试`);
                        continue;
                    }
                    this.files.push({
                        name: f.name,
                        size: f.size,
                        file: f,
                        done: false,
                    });
                }
            },
            clearFiles() {
                this.files = [];
            },
            sendAllFiles() {
                if (!this.connected || this.files.length === 0 || this.sending) return;
                this.sending = true;
                let sentCount = 0;
                const total = this.files.length;

                for (const f of this.files) {
                    if (f.done) {
                        sentCount++;
                        continue;
                    }
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const base64 = e.target.result.split(',')[1];
                        if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                            this.ws.send(JSON.stringify({
                                type: 'file-data',
                                payload: {
                                    fileName: f.name,
                                    fileSize: f.size,
                                    fileDataBase64: base64
                                }
                            }));
                            f.done = true;
                            sentCount++;
                            if (sentCount === total) {
                                this.sending = false;
                                alert('✅ 所有文件已发送！');
                            }
                        } else {
                            alert('连接已断开，发送失败');
                            this.sending = false;
                        }
                    };
                    reader.onerror = () => {
                        alert(`读取文件 "${f.name}" 失败`);
                        this.sending = false;
                    };
                    reader.readAsDataURL(f.file);
                }
                if (this.files.every(f => f.done)) {
                    this.sending = false;
                    alert('✅ 所有文件已发送！');
                }
            },
            downloadFile(fileName, base64Data) {
                try {
                    const byteCharacters = atob(base64Data);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray]);
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(link.href);
                } catch (e) {
                    alert('文件接收失败：' + e.message);
                }
            }
        },
        mounted() {
            this.connectWebSocket();
        },
        beforeDestroy() {
            if (this.ws) {
                this.ws.close();
            }
        }
    });
</script>
</body>
</html>
